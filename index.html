<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3분 역량 회고 | 성균 STAR 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--g9:#0A3D2B;--g7:#0F5A3F;--gold:#B8963E;--paper:#F4F5F0;--card:#fff;--ink:#16211C;--mute:#62706A;--line:#DCE2DA;
--in:#2E7D5B;--ui:#B8963E;--ye:#B5483A;--ji:#24408E;--r:14px;--serif:'Noto Serif KR','Batang',serif;
--sans:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);line-height:1.3}
.hdr{position:sticky;top:0;z-index:20;background:var(--g9);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hdr-in{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr .who{font-family:var(--serif);font-weight:800;font-size:17px;margin-right:auto}
.hdr select{background:#0F5A3F;border:1px solid #ffffff55;border-radius:999px;padding:6px 12px;color:#fff;font-size:14px}
.count{background:var(--gold);color:#1d1606;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
main{max-width:980px;margin:auto;padding:16px 16px 120px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:10px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;gap:14px}
@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-bottom:0}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar-in{max-width:560px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--mute);font-weight:600}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--g7)}
.tb.rec .dot{width:46px;height:46px;border-radius:50%;background:var(--g7);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 12px #0a3d2b55;border:3px solid #fff}
.tb.rec svg{stroke:#fff}
.tb.rec.on{color:var(--g7)}
.seal{--c:var(--in);width:46px;height:46px;border:2.5px solid var(--c);color:var(--c);border-radius:7px;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:25px;transform:rotate(-3deg);flex:none;background:#fff;position:relative}
.seal::after{content:'';position:absolute;inset:3px;border:1px solid var(--c);border-radius:4px;opacity:.5}
.v-in{--c:var(--in)}.v-ui{--c:var(--ui)}.v-ye{--c:var(--ye)}.v-ji{--c:var(--ji)}
.toggle{display:inline-flex;background:#E7EBE4;border-radius:999px;padding:3px;margin-bottom:14px}
.toggle button{padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;color:var(--mute)}
.toggle button.on{background:var(--g7);color:#fff}
.chartbox{position:relative;height:300px}
.persona{background:linear-gradient(135deg,var(--g9),var(--g7));color:#fff;border:0}
.persona .t{font-family:var(--serif);font-size:22px;font-weight:800}
.persona .s{opacity:.8;font-size:13px;margin-top:4px}
.vrow{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.vrow:last-child{border:0}
.vrow .bar{height:10px;background:#E7EBE4;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.vrow .bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .6s}
.vrow .meta{flex:1;min-width:0}
.vrow .top{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.lv{font-size:12px;background:var(--c);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.gap{border-left:5px solid var(--gold);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.gap b{font-family:var(--serif)}
.btn{background:var(--g7);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:#fff;color:var(--g7);border:1.5px solid var(--g7)}
.btn.gold{background:var(--gold);color:#1d1606}
.btn:disabled{background:#C5CCC6;color:#fff;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.scrim{position:fixed;inset:0;background:#0a1a1366;z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto;transform:translateY(105%);transition:transform .25s;max-width:640px;margin:auto}
.sheet.on{transform:none}
.modal{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 28px));max-height:86vh;overflow:auto;background:#fff;border-radius:18px;padding:20px;display:none}
.modal.on{display:block}
.stars dt{font-weight:800;color:var(--g7);margin-top:10px}
.stars dd{margin:2px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--ink);transition:.15s}
.chip.on{background:var(--c,var(--g7));border-color:var(--c,var(--g7));color:#fff}
.chip.add{border-style:dashed;color:var(--mute)}
.chip.rec{background:#FBF6E8;border-color:#E6D7A8}
.chip.rec.on{background:var(--c);border-color:var(--c)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.seg{grid-template-columns:repeat(4,1fr)}}
.seg button{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.seg button.on{background:var(--g7);border-color:var(--g7);color:#fff}
.gl{display:flex;justify-content:space-between;font-weight:700;margin:14px 0 8px}
.gl small{color:var(--mute);font-weight:600}
input[type=text],textarea,select.f{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
textarea{resize:vertical;min-height:64px}
.star label{display:flex;gap:8px;align-items:center;font-weight:800;margin:12px 0 5px}
.star label .l{width:26px;height:26px;border-radius:7px;background:var(--g9);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:14px}
.cc{text-align:right;font-size:12px;color:var(--mute)}
.preview{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.preview .p{display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:13px;min-width:54px}
.preview .p.zero{opacity:.35}
.preview .p .pt{color:var(--c)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.badge{background:#FBF6E8;border:1px solid #E6D7A8;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700}
.adder{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
.adder.on{display:flex}
.adder select{border:1.5px solid var(--line);border-radius:10px;padding:8px}
.adder input{flex:1;min-width:120px}
.rmwrap{display:grid;gap:12px}
@media(min-width:820px){.rmwrap{grid-template-columns:200px 1fr}}
.inbox{min-height:80px;display:flex;flex-direction:column;gap:8px}
.inbox.over,.col.over{outline:2px dashed var(--g7);background:#EAF3EE}
.node{background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--c,var(--g7));border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;position:relative;cursor:grab;text-align:left;width:100%}
.node small{display:block;color:var(--mute);font-weight:500}
.node.plan{border-style:dashed;border-left-style:solid}
.node.pick,.node.from{box-shadow:0 0 0 3px var(--gold)}
.node .x{position:absolute;top:2px;right:6px;color:var(--mute)}
.board{overflow-x:auto;padding-bottom:6px}
.track{position:relative;display:flex;gap:10px;min-width:max-content}
.col{width:170px;min-height:240px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.col.cur{border-color:var(--g7);box-shadow:inset 0 0 0 1px var(--g7)}
.col h4{font-size:13px;color:var(--g7);font-family:var(--serif)}
#links{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
#links path{fill:none;stroke:var(--g7);stroke-width:2.5}
#links path.dashed{stroke:var(--gold);stroke-dasharray:7 6}
#links path.hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.cap{position:fixed;left:12px;right:12px;bottom:92px;max-width:520px;margin:auto;background:var(--g9);color:#fff;border-radius:14px;padding:14px;z-index:35;display:none}
.cap.on{display:block}
details.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
details.acc summary{padding:12px 14px;font-weight:700;cursor:pointer}
details.acc .b{padding:0 14px 12px}
.hl{background:#FBF1CC;border-radius:6px;padding:1px 6px;font-weight:800;font-size:12.5px}
.ntag{font-size:12px;background:#E7EBE4;border-radius:99px;padding:2px 9px;font-weight:600}
.dd{background:var(--g7);color:#fff;border-radius:8px;padding:3px 9px;font-weight:800;font-size:13px}
.dd.hot{background:var(--ye)}
.path{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.path div{display:flex;gap:8px}
.path b{color:var(--g7);min-width:48px;font-family:var(--serif)}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#222;color:#fff;border-radius:99px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:100;text-align:center;font-family:var(--serif);color:var(--g7)}
.sp{width:34px;height:34px;border:4px solid #cfd8d1;border-top-color:var(--g7);border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div><div class="sp"></div>성균 STAR 아카이브를 불러오는 중…</div></div>

<header class="hdr"><div class="hdr-in">
  <div class="who"><span id="uname">…</span> 님</div>
  <select id="semSel" aria-label="학기 선택"></select>
  <div class="count" id="cnt">누적 0건</div>
</div></header>

<main>
<!-- TAB 1: 대시보드 -->
<section class="tab on" id="t0">
  <div class="toggle" role="group" aria-label="보기 기준"><button id="vAll" class="on">전체 누적 보기</button><button id="vSem">학기별 보기</button></div>
  <div class="grid2">
    <div class="card"><h3>나의 성균 역량 지도</h3><div class="chartbox"><canvas id="radar" aria-label="인의예지 레이더 차트"></canvas></div>
      <p class="muted" style="margin-top:8px">실선은 나, 점선은 학우 평균이에요. 축을 누르면 세부 태그를 볼 수 있어요.</p></div>
    <div>
      <div class="card persona" id="persona"></div>
      <div class="card" id="vlist"></div>
    </div>
  </div>
  <div class="card gap" id="gap" style="margin-top:14px"></div>
</section>

<!-- TAB 2: 3분 기록 -->
<section class="tab" id="t1">
  <div class="card">
    <h3>1. 어떤 활동이었나요?</h3>
    <div class="seg" id="seg"></div>
    <div style="margin-top:12px"><input type="text" id="actName" list="acts" maxlength="60" placeholder="활동명을 선택하거나 직접 입력하세요" aria-label="활동명"><datalist id="acts"></datalist></div>
    <div class="gl"><span>추천 역량</span><small>눌러서 바로 담기</small></div>
    <div class="chips" id="recBar"></div>
  </div>
  <div class="card">
    <h3>2. 역량 태그를 골라주세요</h3>
    <div id="chipGrid"></div>
    <button class="chip add" id="addBtn" style="margin-top:14px">+ 직접 추가</button>
    <div class="adder" id="adder"><select id="adGroup" aria-label="태그 분류"></select><input type="text" id="adText" maxlength="12" placeholder="태그 이름 (12자 이내)"><button class="btn sm" id="adOk">추가</button></div>
    <p class="muted" style="margin-top:8px">직접 추가한 태그는 기록에는 남지만 점수는 0pt예요.</p>
  </div>
  <div class="card star">
    <h3>3. STAR + 성찰, 한 줄씩</h3>
    <div id="starBox"></div>
  </div>
  <div class="card">
    <h3>4. 이번 기록으로 얻는 성균 가치</h3>
    <div class="preview" id="prev"></div>
    <div class="badges" id="prevBadges"></div>
    <button class="btn" id="saveBtn" style="width:100%;margin-top:16px;padding:14px" disabled>포트폴리오 저장하기</button>
    <p class="muted" id="saveHint" style="margin-top:8px;text-align:center"></p>
  </div>
</section>

<!-- TAB 3: 로드맵 -->
<section class="tab" id="t2">
  <div class="card">
    <div class="row">
      <select class="f" id="career" style="max-width:260px" aria-label="진로 시작점"></select>
      <button class="btn ghost sm" id="linkMode">🔗 연결 모드 끄기</button>
    </div>
    <p class="muted" style="margin-top:8px">활동함의 카드를 학기 칸으로 끌어놓으세요. 연결 모드에서 두 활동을 차례로 누르면 선이 이어져요.</p>
  </div>
  <div class="rmwrap">
    <div class="card"><h3>미연결 활동함</h3><div class="inbox" id="inbox"></div></div>
    <div class="card"><h3>성장 타임라인</h3><div class="board" id="board"><div class="track" id="track"><svg id="links"></svg></div></div></div>
  </div>
  <div class="card"><h3>목표 역량별 계단 보기</h3><div class="chips" id="goalChips" style="margin-bottom:10px"></div><div id="stair"></div></div>
</section>

<!-- TAB 4: 탐색·공지 -->
<section class="tab" id="t3">
  <div class="toggle" role="group"><button id="xFeed" class="on">개인 맞춤 공지 피드</button><button id="xStory">선배 성장 스토리</button></div>
  <div id="feedWrap"><div class="chips" id="fchips" style="margin-bottom:12px"></div><div id="feed"></div></div>
  <div id="storyWrap" style="display:none"></div>
</section>
</main>

<!-- 하단 탭 바 -->
<nav class="tabbar"><div class="tabbar-in">
  <button class="tb on" data-t="0"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>대시보드</button>
  <button class="tb rec" data-t="1"><span class="dot"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>3분 기록</button>
  <button class="tb" data-t="2"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>로드맵</button>
  <button class="tb" data-t="3"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>탐색·공지</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="cap" id="cap"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Spring Boot REST API 통신용 Fetch 함수
async function run(fn, ...args) {
  if (fn === 'getBootstrap') {
    const res = await fetch('/api/bootstrap');
    return await res.json();
  }
  if (fn === 'saveRecord') {
    const res = await fetch('/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(args[0])
    });
    return await res.json();
  }
  if (fn === 'toggleBookmark') {
    const res = await fetch(`/api/records/${args[0]}/bookmark`, { method: 'PUT' });
    return await res.json();
  }
  if (fn === 'aiLink') {
    const res = await fetch('/api/ai/link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ titleA: args[0], tagsA: args[1], titleB: args[2], tagsB: args[3] })
    });
    return await res.text();
  }
  if (fn === 'aiGap') {
    const res = await fetch(`/api/ai/gap?weak=${args[0]}&career=${encodeURIComponent(args[1]||'')}`);
    return await res.json();
  }
  if (fn === 'saveRoadmap') {
    const res = await fetch('/api/roadmap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: args[0]
    });
    return await res.json();
  }
}

const V=[{k:'in',ko:'인',han:'仁'},{k:'ui',ko:'의',han:'義'},{k:'ye',ko:'예',han:'禮'},{k:'ji',ko:'지',han:'智'}];
const VM=Object.fromEntries(V.map(v=>[v.k,v]));
const LV=[0,30,70,120,180];
const GN={role:'역할',tool:'도구/스킬',method:'방법론',trouble:'트러블슈팅'};
const sl=s=>s+'-학기';
let S={cfg:null,user:null,records:[],peer:null,sem:'2026-1',view:'all',tv:{},
  form:{type:'수업/과제',tags:{role:[],tool:[],method:[],trouble:[]},custom:{role:[],tool:[],method:[],trouble:[]}},
  rm:{career:'',planned:[],links:[]},pick:null,linkOn:false,linkFrom:null,goal:'ji',radar:null,xtab:'feed',fchip:'전체',saving:false};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function openLayer(el){$('#scrim').classList.add('on');el.classList.add('on')}
function closeLayers(){['#sheet','#modal','#scrim'].forEach(s=>$(s).classList.remove('on'))}
$('#scrim').onclick=closeLayers;

run('getBootstrap').then(d=>{
  S.cfg=d.cfg;S.user=d.user;S.records=d.records;S.peer=d.peer;S.sem=d.cfg.defaultSemester;
  S.cfg.GROUPS.forEach(g=>Object.entries(S.cfg.TAGS[g].items).forEach(([t,v])=>S.tv[t]=v));
  init();$('#boot').remove();
}).catch(e=>{$('#boot').innerHTML='<div><b>불러오지 못했어요.</b><p class="muted" style="margin-top:8px">'+esc(e.message)+'</p></div>'});

function init(){
  $('#uname').textContent=S.user.name;
  $('#semSel').innerHTML=S.cfg.SEMESTERS.map(s=>`<option value="${s}" ${s===S.sem?'selected':''}>${sl(s)}</option>`).join('');
  $('#semSel').onchange=e=>{S.sem=e.target.value;renderDash();renderRoad()};
  document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>go(+b.dataset.t));
  $('#vAll').onclick=()=>{S.view='all';renderDash()};$('#vSem').onclick=()=>{S.view='sem';renderDash()};
  initForm();initRoad();initExplore();renderCount();renderDash();renderRoad();renderExplore();
}
function go(i){
  document.querySelectorAll('.tab').forEach((t,n)=>t.classList.toggle('on',n===i));
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',+b.dataset.t===i));
  window.scrollTo({top:0});if(i===2)drawLinks();$('#cap').classList.remove('on');
}
function renderCount(){$('#cnt').textContent='누적 '+S.records.length+'건'}
const tagsOf=r=>[].concat(r.role||[],r.tool||[],r.method||[],r.trouble||[]);
const sumOf=rs=>rs.reduce((a,r)=>{V.forEach(v=>a[v.k]+=r.sc[v.k]);return a},{in:0,ui:0,ye:0,ji:0});
const lvOf=p=>LV.reduce((l,t,i)=>p>=t?i+1:l,1);

function curRecs(){return S.view==='all'?S.records:S.records.filter(r=>r.sem===S.sem)}
function renderDash(){
  $('#vAll').classList.toggle('on',S.view==='all');$('#vSem').classList.toggle('on',S.view==='sem');
  const rs=curRecs(),sc=sumOf(rs);
  const peer=S.peer||{in:30,ui:25,ye:30,ji:35};
  const data=V.map(v=>sc[v.k]),pd=V.map(v=>peer[v.k]);
  const max=Math.max(40,Math.ceil(Math.max(...data,...pd)/10)*10+10);
  if(!S.radar){
    S.radar=new Chart($('#radar'),{type:'radar',data:{labels:V.map(v=>v.ko+' '+v.han),datasets:[
      {label:'나',data,borderColor:'#0F5A3F',backgroundColor:'#0F5A3F33',borderWidth:3,pointBackgroundColor:'#0F5A3F'},
      {label:'학우 평균',data:pd,borderColor:'#B8963E',backgroundColor:'transparent',borderDash:[6,5],borderWidth:2,pointRadius:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{r:{min:0,max,ticks:{display:false,stepSize:max/4},pointLabels:{font:{size:15,weight:'700'}},grid:{color:'#DCE2DA'},angleLines:{color:'#DCE2DA'}}}}});
  }else{const c=S.radar;c.data.datasets[0].data=data;c.options.scales.r.max=max;c.update()}

  const top=V.filter(v=>sc[v.k]>0).sort((a,b)=>sc[b.k]-sc[a.k]).slice(0,2);
  let pt='기록을 시작해 나만의 칭호를 얻어보세요',ps='3분 기록 한 번이면 첫 칭호가 생겨요.';
  if(top.length){
    const key=top.map(v=>v.k).sort((a,b)=>V.findIndex(x=>x.k===a)-V.findIndex(x=>x.k===b)).join('+');
    pt='🏆 ['+top.map(v=>v.ko).join('+')+'] '+(top.length>1?S.cfg.PERSONA[key]:S.cfg.PERSONA_SOLO[top[0].k]);
    ps=(S.view==='all'?'전체 누적':sl(S.sem))+' 기준 · 기록 '+rs.length+'건';
  }
  $('#persona').innerHTML=`<div class="t">${esc(pt)}</div><div class="s">${esc(ps)}</div>`;

  $('#vlist').innerHTML='<h3>4대 성균 가치</h3>'+V.map(v=>{
    const p=sc[v.k],l=lvOf(p),goal=l>=5?LV[4]:LV[l],pct=Math.min(100,Math.round(p/goal*100));
    return `<button class="vrow v-${v.k}" data-k="${v.k}"><span class="seal">${v.han}</span><span class="meta">
      <span class="top"><span>${v.ko} <span class="lv">Lv.${l}</span></span><span>${p}pt</span></span>
      <span class="bar" style="display:block"><i style="width:${pct}%"></i></span>
      <span class="muted">${l>=5?'최고 레벨 달성':'다음 Lv.'+(l+1)+'까지 '+(goal-p)+'pt'}</span></span></button>`}).join('');
  document.querySelectorAll('.vrow').forEach(b=>b.onclick=()=>openSheet(b.dataset.k));
  renderGap(sc);
}

function renderGap(sc){
  const g=$('#gap');
  if(!S.records.length){g.innerHTML='<span class="muted">기록이 쌓이면 보완하면 좋은 역량을 추천해 드려요.</span>';return}
  const weak=V.slice().sort((a,b)=>sc[a.k]-sc[b.k])[0];
  run('aiGap',weak.k,S.rm.career).then(r=>{
    if(!r){g.innerHTML='<span class="muted">지금은 추천할 활동이 없어요.</span>';return}
    g.innerHTML=`<div><span class="muted">${weak.ko}(${weak.han}) 보완 추천</span><br><b>[${esc(r.title)} / ${esc(r.tag)}]</b><br><span class="muted">${esc(r.reason)}</span></div><a class="btn sm" href="${esc(r.link)}" target="_blank" rel="noopener">원문 보기</a>`
  }).catch(()=>{g.innerHTML='<span class="muted">추천을 불러오지 못했어요.</span>'});
}

function openSheet(k){
  const v=VM[k],cnt={};
  curRecs().forEach(r=>tagsOf(r).forEach(t=>{if(S.tv[t]===k)cnt[t]=(cnt[t]||0)+1}));
  const ts=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const sh=$('#sheet');
  sh.innerHTML=`<div class="row" style="margin-bottom:12px"><span class="seal v-${k}">${v.han}</span><div><h3>${v.ko}(${v.han}) 세부 태그</h3><span class="muted">태그를 누르면 해당 기록을 볼 수 있어요.</span></div></div>`+
    (ts.length?`<div class="chips">${ts.map(t=>`<button class="chip on v-${k}" data-t="${esc(t)}">#${esc(t)} ×${cnt[t]}</button>`).join('')}</div>`:'<div class="empty">아직 이 가치에 연결된 태그가 없어요.</div>');
  sh.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openTagRecs(b.dataset.t));
  openLayer(sh);
}

function openTagRecs(tag){
  const rs=curRecs().filter(r=>tagsOf(r).indexOf(tag)>=0);
  const m=$('#modal');
  m.innerHTML=`<h3>#${esc(tag)} 기록</h3>`+rs.map(recHtml).join('<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">')+`<button class="btn" style="width:100%;margin-top:14px" id="mc">닫기</button>`;
  $('#sheet').classList.remove('on');openLayer(m);bindRec(m);$('#mc').onclick=closeLayers;
}

function recHtml(r){
  return `<div><div class="row" style="justify-content:space-between"><b>${esc(r.name)}</b><button class="bm" data-id="${esc(r.id)}" style="font-size:20px">${r.bm?'★':'☆'}</button></div>
  <div class="muted">${esc(r.type)} · ${sl(r.sem)} · ${esc(r.ts)}</div>
  <div class="chips" style="margin:8px 0">${tagsOf(r).map(t=>`<span class="ntag">#${esc(t)}</span>`).join('')}</div>
  <dl class="stars"><dt>S 상황</dt><dd>${esc(r.s)}</dd><dt>T 과제</dt><dd>${esc(r.t)}</dd><dt>A 행동</dt><dd>${esc(r.a)}</dd><dt>R 성과</dt><dd>${esc(r.r)}</dd><dt>성찰</dt><dd>${esc(r.ref)}</dd></dl></div>`;
}
function bindRec(root){root.querySelectorAll('.bm').forEach(b=>b.onclick=()=>{
  const r=S.records.find(x=>x.id===b.dataset.id);
  run('toggleBookmark',b.dataset.id).then(n=>{r.bm=n;b.textContent=n?'★':'☆'}).catch(()=>toast('저장하지 못했어요'))})}

// Tab 2, 3, 4 초기화 및 렌더링 로직
function initForm(){
  $('#seg').innerHTML=S.cfg.TYPES.map(t=>`<button data-t="${esc(t)}">${esc(t)}</button>`).join('');
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{S.form.type=b.dataset.t;renderForm()});
  const g=[['S','상황','어떤 상황이었나요?'],['T','과제','내게 주어진 목표는?'],['A','행동','내가 직접 한 일은?'],['R','성과','눈에 보이는 결과는?'],['↺','성찰','배운 점은?']];
  $('#starBox').innerHTML=g.map((x,i)=>`<label for="st${i}"><span class="l">${x[0]}</span>${x[1]}</label><textarea id="st${i}" rows="2" maxlength="100" placeholder="${esc(x[2])}"></textarea><div class="cc" id="cc${i}">0/100</div>`).join('');
  g.forEach((_,i)=>$('#st'+i).addEventListener('input',()=>{$('#cc'+i).textContent=$('#st'+i).value.length+'/100';validate()}));
  $('#actName').addEventListener('input',validate);
  $('#adGroup').innerHTML=S.cfg.GROUPS.map(k=>`<option value="${k}">${GN[k]}</option>`).join('');
  $('#addBtn').onclick=()=>$('#adder').classList.toggle('on');
  $('#adOk').onclick=()=>{const k=$('#adGroup').value,t=$('#adText').value.trim().slice(0,12);if(!t)return;S.form.custom[k].push(t);toggleTag(k,t,true);$('#adText').value='';renderForm()};
  $('#saveBtn').onclick=save;renderForm();
}
function toggleTag(k,t,quiet){
  const a=S.form.tags[k],i=a.indexOf(t);
  if(i>=0)a.splice(i,1);else a.push(t);
  if(!quiet)renderForm();
}
function renderForm(){
  const f=S.form,c=S.cfg;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===f.type));
  $('#acts').innerHTML=(c.ACTIVITY_PRESETS[f.type]||[]).map(x=>`<option value="${esc(x)}">`).join('');
  $('#recBar').innerHTML=(c.RECOMMEND[f.type]||[]).map(t=>{const k=c.GROUPS.find(g=>c.TAGS[g].items[t]),v=S.tv[t];
    return `<button class="chip rec v-${v} ${f.tags[k].indexOf(t)>=0?'on':''}" data-k="${k}" data-t="${esc(t)}">#${VM[v].ko}_${esc(t)}</button>`}).join('');
  $('#chipGrid').innerHTML=c.GROUPS.map(k=>{const items=Object.keys(c.TAGS[k].items).concat(f.custom[k]);
    return `<div class="gl"><span>${GN[k]}</span></div><div class="chips">${items.map(t=>{const v=S.tv[t];
      return `<button class="chip ${v?'v-'+v:''} ${f.tags[k].indexOf(t)>=0?'on':''}" data-k="${k}" data-t="${esc(t)}">${esc(t)}</button>`}).join('')}</div>`}).join('');
  document.querySelectorAll('#recBar .chip,#chipGrid .chip').forEach(b=>b.onclick=()=>toggleTag(b.dataset.k,b.dataset.t));
  validate();
}
function validate(){
  if(!$('#saveBtn'))return;
  const n=Object.values(S.form.tags).flat().length;
  $('#saveBtn').disabled=!$('#actName').value.trim()||!n||S.saving;
}
function save(){
  if(S.saving)return;S.saving=true;
  run('saveRecord',{type:S.form.type,semester:S.sem,name:$('#actName').value.trim(),tags:S.form.tags,
    s:$('#st0').value,t:$('#st1').value,a:$('#st2').value,r:$('#st3').value,ref:$('#st4').value}).then(rec=>{
    S.records.push(rec);renderCount();renderDash();renderRoad();
    toast('기록이 저장되었습니다!');resetForm();go(0);
  }).catch(()=>toast('저장 실패')).finally(()=>S.saving=false);
}
function resetForm(){S.form.tags={role:[],tool:[],method:[],trouble:[]};$('#actName').value='';for(let i=0;i<5;i++)$('#st'+i).value='';renderForm()}

function initRoad(){
  $('#career').innerHTML='<option value="">진로 시작점 선택</option>'+S.cfg.CAREERS.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#career').onchange=e=>{
    S.rm.career=e.target.value;
    S.rm.planned=[{id:'P1',title:'차세대 배터리 URP',type:'URP/연구실',tags:['Python','오차원인_규명'],sem:'2026-1'}];
    renderRoad();
  };
  $('#linkMode').onclick=()=>{S.linkOn=!S.linkOn;renderRoad()};
}
function nodes(){return S.records.map(r=>({id:r.id,title:r.name,type:r.type,sem:r.sem,tags:tagsOf(r),done:true})).concat(S.rm.planned)}
function renderRoad(){
  $('#linkMode').textContent=S.linkOn?'🔗 연결 모드 켜짐':'🔗 연결 모드 꺼짐';
  $('#inbox').innerHTML=S.rm.planned.filter(p=>!p.sem).map(n=>`<div class="node">${esc(n.title)}</div>`).join('')||'<span class="muted">예정 활동이 없어요.</span>';
  const track=$('#track'),svg=$('#links');track.innerHTML='';
  S.cfg.SEMESTERS.forEach(s=>{
    const c=document.createElement('div');c.className='col'+(s===S.sem?' cur':'');
    c.innerHTML=`<h4>${sl(s)}</h4>`+nodes().filter(n=>n.sem===s).map(n=>`<div class="node">${esc(n.title)}</div>`).join('');
    track.appendChild(c);
  });
  track.appendChild(svg);
}
function drawLinks(){}
function renderStair(){$('#stair').innerHTML='<div class="empty">준비 중이에요.</div>'}

function initExplore(){
  $('#xFeed').onclick=()=>{S.xtab='feed';renderExplore()};$('#xStory').onclick=()=>{S.xtab='story';renderExplore()};
}
function renderExplore(){
  const feed=S.xtab==='feed';$('#xFeed').classList.toggle('on',feed);$('#xStory').classList.toggle('on',!feed);
  $('#feedWrap').style.display=feed?'':'none';$('#storyWrap').style.display=feed?'none':'';
  $('#feed').innerHTML=S.cfg.NOTICES.map(n=>`<div class="card"><span class="dd">D-${n.daysLeft}</span><h3>${esc(n.title)}</h3><p class="muted">${esc(n.reason)}</p></div>`).join('');
  $('#storyWrap').innerHTML=S.cfg.STORIES.map(s=>`<div class="card"><h3>${esc(s.who)}</h3></div>`).join('');
}
</script>
</body>
</html>
